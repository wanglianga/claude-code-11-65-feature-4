server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: agri-point-in-time-feature-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/agri_pit}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  demo:
    seed-on-startup: ${APP_SEED_DEMO:true}
  orchestrator:
    worker-poll-interval-ms: ${APP_ORCH_POLL_MS:500}
    worker-enabled: ${APP_ORCH_WORKER_ENABLED:true}
    max-recompute-attempts: 3

logging:
  level:
    com.agri.pit: INFO
    org.flywaydb: INFO
